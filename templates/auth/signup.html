<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · {{App name}}</title>
  <meta name="description" content="{{One sentence describing this screen}}">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () { try { var s = localStorage.getItem('bm-ds-theme'); var t = s === 'light' || s === 'dark' || s === 'system' ? s : 'system'; var r = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t; if (r === 'dark') document.documentElement.classList.add('dark'); } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="design-system.css">
</head>
<body>
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-page focus:px-3 focus:py-2">Skip to content</a>
  <main id="main" class="flex min-h-screen items-center justify-center bg-page px-4 py-12 text-ink-body">
    <div class="w-full max-w-md">
      <p class="mb-6 flex items-center justify-center gap-2 font-semibold text-ink-display"><img src="icon.svg" alt="" width="28" height="28">{{App name}}</p>
      <div class="callout">
        <div class="text-center">
          <h1 class="text-2xl">Create your account</h1>
          <p class="mt-2 text-sm text-ink-muted">Already have an account? <a href="index.html">Log in</a></p>
        </div>
        <p id="form-status" role="status" class="mt-4 text-center text-sm"></p>
        <form class="mt-6 space-y-4" data-auth-form novalidate>
          <div class="space-y-2"><label for="name">Name</label><input id="name" name="name" type="text" class="form-control" autocomplete="name" required></div>
          <div class="space-y-2"><label for="email">Email</label><input id="email" name="email" type="email" class="form-control" autocomplete="email" required></div>
          <div class="space-y-2"><label for="password">Password</label><input id="password" name="password" type="password" class="form-control" autocomplete="new-password" minlength="12" required>
            <p class="text-xs text-ink-muted">At least 12 characters.</p></div>
          <button type="submit" class="btn btn-primary w-full">Create account</button>
        </form>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
